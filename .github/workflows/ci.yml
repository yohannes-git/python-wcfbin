name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: the last runner image with Python 3.8 and 3.9
        os: [ubuntu-24.04]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: windows-latest
            python: '3.x'
          - os: macos-latest
            python: '3.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  lint:
    name: Pyflakes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/requirements-ci.txt
      # wcf/records/__init__.py gathers the record modules with star imports
      - run: python -m flake8 --select=F --extend-ignore=F403,F405 wcf tests doc/conformance wcf2xml.py xml2wcf.py

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/requirements-ci.txt
      # the code run by the tests in a subprocess (wcf2xml.py, xml2wcf.py,
      # local time zones) is not counted
      - run: python -m coverage run --branch --source=wcf -m unittest discover -s tests -t .
      - run: python -m coverage report --show-missing --fail-under=99

  conformance:
    name: Conformance matrix up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: sh doc/conformance/build.sh
      # the matrix names the commit it was generated from: only that line
      # may differ
      - run: git diff --exit-code -I '\(revision [0-9a-f]+\)' doc/CONFORMANCE.md

  package:
    name: Installed package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m build
      # the tests, outside the source tree, against the installed wheel and
      # its scripts
      - name: Test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/run"
          cp -r tests "$RUNNER_TEMP/run/"
          cp "$RUNNER_TEMP/venv/bin/wcf2xml.py" "$RUNNER_TEMP/venv/bin/xml2wcf.py" "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys, wcf; assert wcf.__file__.startswith(sys.prefix), wcf.__file__'
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -t .

  dotnet-interop:
    name: .NET Framework WCF interoperability
    # the WCF binary message encoder of .NET Framework, the one of net.tcp
    # (ADWS, IPAM, SCVMM, SharePoint...): see tests/dotnet/run.ps1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: .NET encodes messages
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\dotnet\run.ps1 -Mode produce -Count 3 -Out messages.tsv
      - name: .NET reads the encodings of the library
        shell: bash
        run: |
          status=0
          # dotnet: the XML .NET read, encoded by the library;
          # python: the messages of .NET decoded and encoded again
          for source in dotnet python; do
            python tests/dotnet/encode.py messages.tsv "$source" > tests/dotnet/python.tsv
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/dotnet/run.ps1 -Mode consume | tr -d '\r' > "consume-$source.tsv"
            echo "== $source: $(wc -l < "consume-$source.tsv") messages"
            if [ ! -s "consume-$source.tsv" ] || grep -v "$(printf '\t')OK\$" "consume-$source.tsv"; then
              status=1
            fi
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dotnet-interop
          path: |
            messages.tsv
            consume-*.tsv
          if-no-files-found: ignore
